<svg xmlns="http://www.w3.org/2000/svg" width="1250.0" height="1070.0" viewBox="-290.0 -140.0 1250.0 1070.0"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#364b64"/></marker></defs><rect x="-290.0" y="-140.0" width="1250.0" height="1070.0" fill="#ffffff"/><path d="M 360.0 -65.0 L 242.5 -65.0 L 242.5 70.0 L 125.0 70.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360.0 -65.0 L 360.0 70.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360.0 -65.0 L 480.0 -65.0 L 480.0 70.0 L 600.0 70.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M -65.0 385.0 L 147.5 385.0 L 147.5 740.0 L 360.0 740.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 125.0 70.0 L 110.0 70.0 L 110.0 150.0 L 95.0 150.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360.0 70.0 L 360.0 160.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 600.0 70.0 L 620.0 160.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 95.0 150.0 L 15.0 150.0 L 15.0 385.0 L -65.0 385.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360.0 160.0 L 360.0 400.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 620.0 160.0 L 695.0 160.0 L 695.0 425.0 L 770.0 425.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 770.0 425.0 L 565.0 425.0 L 565.0 740.0 L 360.0 740.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360.0 740.0 L 360.0 860.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><path d="M 360.0 400.0 L 360.0 740.0" fill="none" stroke="#364b64" stroke-width="2" marker-end="url(#arrow)"/><rect x="140.0" y="-110.0" width="440.0" height="90.0" rx="2" fill="#d80073" stroke="#A50040" stroke-width="1.5"/><text x="360.0" y="-76.375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">CORE PROBLEM EIC faces a demand–network alignment challenge,</text><text x="360.0" y="-60.125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">with uneven utilization, congestion and customer-experience</text><text x="360.0" y="-43.875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">gaps despite a growing EV market.</text><rect x="-260.0" y="220.0" width="390.0" height="330.0" rx="2" fill="#ffcd28" stroke="#d79b00" stroke-width="1.5"/><text x="-65.0" y="333.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">1.1 Regional Variation EV adoption concentrated in</text><text x="-65.0" y="349.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">metros Lower penetration in semi-urban and rural areas</text><text x="-65.0" y="365.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">1.2 Peak-Hour Concentration Demand highly concentrated</text><text x="-65.0" y="381.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">during peak hours Demand concentrated at specific</text><text x="-65.0" y="398.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">locations 1.3 Home-Charging Preference 68% of EV owners</text><text x="-65.0" y="414.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">prefer home charging Reduces public charging relevance</text><text x="-65.0" y="430.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">for a large share of EV owners 1.4 Fleet &amp; Public</text><text x="-65.0" y="446.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Charging Demand Public charging serves commuters</text><rect x="60.0" y="40.0" width="130.0" height="60.0" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="125.0" y="66.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">1. DEMAND</text><text x="125.0" y="83.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">CHARACTERISTICS</text><rect x="295.0" y="40.0" width="130.0" height="60.0" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="360.0" y="66.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">2. NETWORK</text><text x="360.0" y="83.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">CAPACITY</text><rect x="535.0" y="40.0" width="130.0" height="60.0" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="600.0" y="66.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">3. NETWORK</text><text x="600.0" y="83.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">ORCHESTRATION</text><rect x="10.0" y="130.0" width="170.0" height="40.0" rx="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="95.0" y="146.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Where, when and from</text><text x="95.0" y="163.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">whom is demand coming?</text><rect x="282.5" y="140.0" width="155.0" height="40.0" rx="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="156.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Is physical capacity</text><text x="360.0" y="173.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">aligned with demand?</text><rect x="530.0" y="130.0" width="180.0" height="60.0" rx="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="620.0" y="156.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Can EIC dynamically match</text><text x="620.0" y="173.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">supply with demand?</text><rect x="170.0" y="240.0" width="380.0" height="320.0" rx="2" fill="#ffcd28" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">2.1 Existing Network 2,800 charging stations across</text><text x="360.0" y="364.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">India 2.2 Low Utilization Average network utilization</text><text x="360.0" y="380.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">is only 46% 2.3 Urban Congestion High-demand metro</text><text x="360.0" y="396.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">locations experience frequent congestion 2.4</text><text x="360.0" y="413.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Underutilization Elsewhere Highway and semi-urban</text><text x="360.0" y="429.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">stations operate significantly below capacity 2.5</text><text x="360.0" y="445.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Charger Mix Mismatch Only 35% of the network is</text><text x="360.0" y="461.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">fast-charging Charging speed is an important customer</text><rect x="610.0" y="210.0" width="320.0" height="430.0" rx="2" fill="#ffcd28" stroke="#d79b00" stroke-width="1.5"/><text x="770.0" y="373.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">3.1 Demand Forecasting Need AI-enabled</text><text x="770.0" y="389.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">forecasting Anticipate where and when demand</text><text x="770.0" y="405.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">will occur 3.2 Load Balancing Need mechanisms</text><text x="770.0" y="421.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">to redirect demand Shift demand from</text><text x="770.0" y="438.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">congested to available stations 3.3 Dynamic</text><text x="770.0" y="454.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">Pricing Use pricing levers to influence</text><text x="770.0" y="470.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">charging behavior Reduce peak-hour/location</text><text x="770.0" y="486.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">congestion 3.4 Reservations Allow customers</text><rect x="20.0" y="690.0" width="680.0" height="100.0" rx="2" fill="#d80073" stroke="#A50040" stroke-width="1.5"/><text x="360.0" y="728.625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">ROOT CAUSE: A potential gap in the granularity and responsiveness of EIC&#x27;s network planning and</text><text x="360.0" y="744.875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">capacity-allocation process, resulting in fixed charging capacity not being sufficiently aligned</text><text x="360.0" y="761.125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">with evolving area-level, customer-segment and peak-period demand.</text><rect x="50.0" y="820.0" width="620.0" height="80.0" rx="6" fill="#d80073" stroke="#A50040" stroke-width="1.5"/><text x="360.0" y="848.625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">ANALYSIS / DIAGNOSIS: Demand is uneven across time and locations, while EIC&#x27;s</text><text x="360.0" y="864.875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">2,800-station network has only 46% average utilization, creating congestion at</text><text x="360.0" y="881.125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#ffffff">high-demand stations and idle capacity elsewhere.</text><text x="-278.0" y="-122.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0a2748">Final Issue Tree</text></svg>