y</text><rect x="540.0" y="270.0" width="90.0" height="30.0" rx="2" fill="none" stroke="none" stroke-width="1.5"/><text x="585.0" y="289.125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#111111">Availability</text><rect x="510.0" y="310.0" width="90.0" height="30.0" rx="2" fill="none" stroke="none" stroke-width="1.5"/><text x="555.0" y="322.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#111111">Charging</text><text x="555.0" y="336.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#111111">speed</text><rect x="500.0" y="355.0" width="90.0" height="30.0" rx="2" fill="none" stroke="none" stroke-width="1.5"/><text x="545.0" y="374.125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#111111">Reliability</text><rect x="465.0" y="398.0" width="90.0" height="30.0" rx="2" fill="none" stroke="none" stroke-width="1.5"/><text x="510.0" y="410.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#111111">Waiting /</text><text x="510.0" y="424.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#111111">congestion</text><rect x="40.0" y="500.0" width="550.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="515.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">ROOT CAUSE: A potential gap in the granularity and responsiveness of EIC&#x27;s</text><text x="315.0" y="531.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">network planning and capacity-allocation process, resulting in fixed charging</text><text x="315.0" y="548.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">capacity not being sufficiently aligned with evolving area-level,</text><text x="315.0" y="564.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">customer-segment and peak-period demand.</text><rect x="40.0" y="600.0" width="640.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="618.625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">EIC&#x27;S CORE PROBLEM: EIC&#x27;s charging network is underperforming: uneven utilization,</text><text x="360.0" y="634.875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">peak-hour congestion, and reliability gaps are limiting customer satisfaction and</text><text x="360.0" y="651.125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#111111">competitive position.</text><text x="2.0" y="18.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0a2748">Ishikawa / Fishbone Diagram</text></svg>